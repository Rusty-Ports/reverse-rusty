[package]
name = "reverse-rusty-ref-matcher"
version = "0.1.0"
edition = "2021"
description = "Semantic matcher for reverse-rusty's correctness oracle (ADR-087). It has its own DSL parser and normalizer, written from the specification by an author who did not see the engine's (ADR-220), preserves the public grammar as a direct predicate tree, and reuses NONE of the engine's code, so front-end and execution-lowering bugs are caught by differential testing. std-only by design: zero dependencies (no daachorse, no serde, no reverse-rusty) makes code independence mechanically provable via `cargo tree`."
license = "MIT"
publish = false

# INDEPENDENCE CONTRACT (enforced by the `ref-matcher independence` lane in check.sh):
# this section MUST stay empty. A dependency on `reverse-rusty` (directly or transitively)
# would defeat the entire purpose — the reference must reuse none of the engine front end.
[dependencies]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Paired concepts have paired names (required/forbidden, N(T)/P(T)); the "names too similar"
# heuristic is noise here.
similar_names = "allow"
# This is a spec reimplementation; per-fn # Errors/# Panics docs add churn without safety.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Domain/identifier names (anyof, req, forb, ...) trip backtick pedantry without value.
doc_markdown = "allow"
